version: '3.8'

services:
  # Backend API service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: barbot-server
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./server:/app
      - /app/__pycache__
    networks:
      - barbot-network

  # Frontend web service
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: barbot-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.barbot-prod.entrypoints=http"
      - "traefik.http.routers.barbot-prod.rule=Host(`barbot.krismitchell.dev`)"
      - "traefik.http.middlewares.barbot-prod-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.barbot-prod.middlewares=barbot-prod-https-redirect"
      - "traefik.http.routers.barbot-prod-secure.entrypoints=https"
      - "traefik.http.routers.barbot-prod-secure.rule=Host(`barbot.krismitchell.dev`)"
      - "traefik.http.routers.barbot-prod-secure.tls=true"
      - "traefik.http.routers.barbot-prod-secure.tls.certresolver=cloudflare"
      - "traefik.http.routers.barbot-prod-secure.middlewares=tinyauth@docker"
      - "traefik.http.routers.barbot-prod-secure.service=barbot-prod-secure@docker"
      - "traefik.http.services.barbot-prod-secure.loadbalancer.server.port=80"
      - "traefik.http.services.barbot-prod-secure.loadbalancer.server.scheme=http"
      - "traefik.docker.network=proxy"
    networks:
      - barbot-network
      - proxy

networks:
  barbot-network:
    driver: bridge
  proxy:
    external: true
